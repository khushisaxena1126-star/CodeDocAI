[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.uv]
package = true

[project]
name = "codedocai"
version = "0.2.2"
description = "AI-powered documentation generator for Python projects"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "GNU AFFERO GENERAL PUBLIC LICENSE"}
authors = [
  {name = "Khushi Saxena"}
]

dependencies = [
    "click",
    "pathspec>=1.0.3",
    "pyyaml",
    "rich",
    "python-dotenv",
    "groq>=1.1.1"
	"flask"
    "gunicorn"
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2",
    "twine>=6.2.0",
]

[project.urls]
Repository = "https://github.com/khushisaxena1126-star/CodeDocAI"
Issues = "https://github.com/khushisaxena1126-star/CodeDocAI/issues"

[project.scripts]
doclify = "doclify.pipelines.supervisor:cli"

[tool.setuptools]
[tool.setuptools.packages.find]
where = ["."]
include = ["doclify*"]

[tool.setuptools.package-data]
"doclify" = ["resources/*.gitignore"]